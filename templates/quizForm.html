{% extends 'adminLayout.html' %}
{% block header %}
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
  <span class="header-badge" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; background: rgba(230, 57, 70, 0.15); color: #e63946; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(230, 57, 70, 0.3);">Vault Creator</span>
  <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; color: #fff;">📜 Add New Question</h2>
</div>
{% endblock %}

{% block content %}
<style>
  .form-card {
    background: rgba(10, 10, 10, 0.92);
    border: 1px solid rgba(230, 57, 70, 0.25);
    border-radius: 20px;
    padding: 35px 30px;
    max-width: 680px;
    margin: 20px auto;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
  }
  .form-label-custom {
    color: #e2e8f0;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
  }
  .input-custom {
    background: rgba(0, 0, 0, 0.7) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.12) !important;
    color: #fff !important;
    border-radius: 12px !important;
    padding: 12px 16px !important;
    transition: all 0.25s ease;
  }
  .input-custom:focus {
    border-color: #e63946 !important;
    box-shadow: 0 0 12px rgba(230, 57, 70, 0.4) !important;
  }
  .btn-submit-custom {
    background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
    cursor: pointer;
  }
  .btn-submit-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(230, 57, 70, 0.6);
  }
</style>

<div class="form-card">
    <form action="/quizForm" method="post">
      <div class="form-group mb-4">
        <label class="form-label-custom">Difficulty Level</label>
        <select name="level" class="form-control input-custom">
            <option value="1">Level 1 - Easy (Basic Facts)</option>
            <option value="2">Level 2 - Medium (Plot Turning Points)</option>
            <option value="3">Level 3 - Hard (Deep Lore)</option>
        </select>
      </div>

      <div class="form-group mb-4">
        <label class="form-label-custom">Question Text</label>
        <textarea name="ques" rows="3" class="form-control input-custom" placeholder="Enter the trivia question..." required></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 form-group mb-4">
          <label class="form-label-custom">Option 1</label>
          <textarea name="opt1" rows="2" class="form-control input-custom" placeholder="First choice..." required></textarea>
        </div>
        <div class="col-md-6 form-group mb-4">
          <label class="form-label-custom">Option 2</label>
          <textarea name="opt2" rows="2" class="form-control input-custom" placeholder="Second choice..." required></textarea>
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="form-label-custom">Correct Option</label>
        <select name="answer" class="form-control input-custom">
            <option value="1">Option 1 is Correct</option>
            <option value="2">Option 2 is Correct</option>
        </select>
      </div>

      <button type="submit" class="btn-submit-custom">🩸 Add Question to Vault</button>
    </form>
</div>
{% endblock %}
