
{% extends 'mainLayout.html' %}
{% block content%}
    {% with message = get_flashed_messages() %}
    {% if message %}
    {% for msg in message %}
    <p class="alert alert-danger" style="font-family: sans-serif; font-size:small; margin-top: 30%; margin-bottom: 0%;">
        {{msg}}
    </p>
    {% endfor %}
    {% endif %}
    {% endwith %}

<body style="
	padding: 0px;
	display:grid;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
  
	font-family: 'Jost', sans-serif; background: #000000; ">
  
	<div class="main" style="border: 1px solid darkred; margin-top: 30%; ">  
		
    <!-- Add this inside <body> -->

		<input type="checkbox" id="chk" aria-hidden="true">

			<div class="signup">
				<form action="/userSignup" method="post">
          
					<label for="chk" aria-hidden="true">Sign up</label>

          <input type="text" name="firstName" placeholder="First Name">
          <input type="text" name="lastName" placeholder="Last Name">
					<!-- <input type="text" name="txt" placeholder="User name" required=""> -->
					<input type="email" name="email" placeholder="Email" required="">
          <input type="number" name="mobile" placeholder="Number" required="">
					<input type="password" name="password" placeholder="Password" required="">
					<button type="submit" style="color: white; width: 100px; height: 30px; font-size: medium;width: 60%;
            height: 30px;
            margin: 10px auto;
            justify-content: center;
            display:block;
            color: #fff;
            background: rgb(115, 6, 6);
            font-size: 1em;
            font-weight: bold;
            margin-top: 30px;
            outline: none;
            border: none;
            border-radius: 5px;
            transition: .2s ease-in;
            cursor: pointer;">Sign up</button>
				</form>
        Already Registered? <a href="/userLogin"> Login Now</a>
			</div>

			<!-- <div class="login">
				<form>
					<label for="chk" aria-hidden="true">Login</label>
					<input type="email" name="email" placeholder="Email" required="">
					<input type="password" name="pswd" placeholder="Password" required="">
					<s-button type="submit">Log in</s-button>
				</form>
			</div> -->
	</div>
  <!-- Bootstrap JS -->
{%endblock%}
</body>
