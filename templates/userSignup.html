{% extends 'mainLayout.html' %}
{% block content %}
<div style="min-height: calc(100vh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px;">
    {% with message = get_flashed_messages() %}
    {% if message %}
    <div style="width: 100%; max-width: 420px; margin-bottom: 20px;">
        {% for msg in message %}
        <div class="alert alert-danger" style="background: rgba(142, 9, 35, 0.4); border: 1px solid #e63946; color: #fff; border-radius: 12px; font-size: 0.9rem;">
            {{msg}}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="main" style="margin: 0 auto; min-height: auto; padding-bottom: 20px;">  
        <input type="checkbox" id="chk" aria-hidden="true">

        <div class="signup" style="padding: 20px 15px;">
            <form action="/userSignup" method="post">
                <label for="chk" aria-hidden="true" style="color: #fff; font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; display: block; text-shadow: 0 0 15px rgba(230, 57, 70, 0.6); text-align: center;">Hunter Registry</label>

                <div style="display: flex; gap: 10px; width: 85%; margin: 8px auto;">
                    <input type="text" name="firstName" placeholder="First Name" required="" style="width: 50%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                    <input type="text" name="lastName" placeholder="Last Name" required="" style="width: 50%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                </div>
                <input type="email" name="email" placeholder="Email Address" required="" style="width: 85%; margin: 8px auto; display: block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                <input type="number" name="mobile" placeholder="Mobile Number" required="" style="width: 85%; margin: 8px auto; display: block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                <input type="password" name="password" placeholder="Password" required="" style="width: 85%; margin: 8px auto; display: block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                <button type="submit" style="width: 85%; height: 46px; margin: 20px auto 14px; display: block; color: #fff; background: linear-gradient(135deg, #c8102e, #e63946); font-size: 1rem; font-weight: bold; outline: none; border: none; border-radius: 10px; box-shadow: 0 6px 20px rgba(200, 16, 46, 0.5); cursor: pointer; transition: all 0.25s ease;">Initiate Pact</button>
            </form>
            <div style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: #aaa;">
                Already Registered? <a href="/userLogin" style="color: #ff4760; font-weight: 600; text-decoration: none;">Login Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
