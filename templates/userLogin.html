{% extends 'mainLayout.html' %}
{% block content%}
    {% with message = get_flashed_messages() %}
    {% if message %}
    {% for msg in message %}
    <p class="alert alert-danger" style="font-family: sans-serif; font-size:small; margin-top: 30%; margin-bottom: 0%;">
        {{msg}}
    </p>
    {% endfor %}
    {% endif %}
    {% endwith %}



<body style="margin: 0;
	padding: 0;
	display: grid;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	font-family: 'Jost', sans-serif; background: #000000;">

  
	<div class="main" style="border: 1px solid darkred; margin-top: 30%;">  	
		<input type="checkbox" id="chk" aria-hidden="true">

			<div class="login" style="font-size: larger; margin-top: 15px;">
				<form action="/userLogin" method="post">
					<label for="chk" aria-hidden="true" style="color: #fff; margin-bottom: 10%; font-size: 40px;">Login</label>
					<input type="email" name="email" placeholder="Email" required="">
					<input type="password" name="password" placeholder="Password" required="">
					<button type="submit" style="color: white; width: 100px; height: 30px; font-size: medium;width: 60%;
            height: 30px;
            margin: 10px auto;
            justify-content: center;
            display:block;
            color: #fff;
            background: rgb(115, 6, 6);
            font-size: 1em;
            font-weight: bold;
            margin-top: 30px;
            outline: none;
            border: none;
            border-radius: 5px;
            transition: .2s ease-in;
            cursor: pointer;">Login</button>
				</form>
				<h5>New User? <a href="/userSignup">Register Now</a></h5>
			</div>
	</div>


{%endblock%}
