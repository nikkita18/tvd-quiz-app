{% extends 'userLayout.html' %}

{% block title %}Change Password | Mystic Realm{% endblock %}

{% block header %}
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
  <span class="header-badge" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; background: rgba(230, 57, 70, 0.15); color: #e63946; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(230, 57, 70, 0.3);">Security Vault</span>
  <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; color: #fff;">🔑 Change Password</h2>
</div>
{% endblock %}

{% block content %}
<style>
  .password-card {
    background: rgba(10, 10, 10, 0.92);
    border: 1px solid rgba(230, 57, 70, 0.25);
    border-radius: 24px;
    padding: 40px 35px;
    max-width: 520px;
    margin: 30px auto 50px auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(230, 57, 70, 0.1);
    text-align: left;
  }
  .pwd-icon-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .pwd-avatar {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(230, 57, 70, 0.15);
    border: 2px solid #e63946;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px auto;
    color: #e63946;
    font-size: 1.8rem;
    box-shadow: 0 0 20px rgba(230, 57, 70, 0.3);
  }
  .input-label {
    color: #94a3b8;
    font-weight: 600;
    font-size: 0.88rem;
    margin-bottom: 8px;
    display: block;
  }
  .custom-input {
    background: rgba(0, 0, 0, 0.7) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.12) !important;
    color: #fff !important;
    border-radius: 12px !important;
    padding: 12px 16px !important;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    width: 100%;
  }
  .custom-input:focus {
    border-color: #e63946 !important;
    box-shadow: 0 0 12px rgba(230, 57, 70, 0.4) !important;
    outline: none;
  }
  .btn-submit-pwd {
    background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
    cursor: pointer;
    margin-top: 15px;
  }
  .btn-submit-pwd:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(230, 57, 70, 0.6);
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    margin-top: 20px;
    transition: color 0.25s ease;
  }
  .back-link:hover {
    color: #fff;
    text-decoration: none;
  }
</style>

<div class="password-card">
  <div class="pwd-icon-header">
    <div class="pwd-avatar">
      <i class="fas fa-lock"></i>
    </div>
    <h3 style="margin: 0; color: #fff; font-weight: 700;">Update Access Key</h3>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Ensure your secret cipher remains uncompromised.</p>
  </div>

  <form action="/userPassword" method="post">
    <div class="form-group mb-3">
      <label class="input-label">Current Password</label>
      <input type="password" name="oldPassword" class="custom-input" placeholder="Enter current password" required>
    </div>

    <div class="form-group mb-4">
      <label class="input-label">New Password</label>
      <input type="password" name="newPassword" class="custom-input" placeholder="Enter new password" required>
    </div>

    <button type="submit" class="btn-submit-pwd">🔐 Update Password</button>
  </form>

  <div style="text-align: center;">
    <a href="/userProfile" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Profile
    </a>
  </div>
</div>

{% endblock %}
