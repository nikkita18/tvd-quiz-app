<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification | Mystic Realm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #000000;
      font-family: 'Jost', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .verify-card {
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(230, 57, 70, 0.15);
      text-align: center;
    }
    .verify-icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(230, 57, 70, 0.15);
      border: 2px solid #e63946;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: #e63946;
      font-size: 2rem;
      box-shadow: 0 0 20px rgba(230, 57, 70, 0.4);
    }
    .otp-input {
      background: rgba(0, 0, 0, 0.7) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
      border-radius: 14px !important;
      padding: 14px !important;
      font-size: 1.4rem !important;
      letter-spacing: 8px !important;
      text-align: center !important;
      font-weight: 700 !important;
    }
    .otp-input:focus {
      border-color: #e63946 !important;
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.4) !important;
      outline: none;
    }
    .btn-verify {
      background: linear-gradient(135deg, #e63946 0%, #c1121f 100%);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
      margin-top: 15px;
    }
    .btn-verify:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(230, 57, 70, 0.6);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="verify-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="background: rgba(230, 57, 70, 0.2); border-color: rgba(230, 57, 70, 0.4); color: #fff;">
            {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="verify-icon">
      <i class="fas fa-envelope-open-text"></i>
    </div>
    <h3 style="font-family: 'Cinzel', serif; font-weight: 700; color: #fff;">Verification Code</h3>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">
      Enter the 4-digit security code sent to <br>
      <strong style="color: #e63946;">{{userEmail}}</strong>
    </p>

    <form action="/emailVerify?userEmail={{userEmail}}" method="post">
      <div class="mb-4">
        <input type="text" name="otp" maxlength="4" class="form-control otp-input" placeholder="••••" required autofocus autocomplete="off">
      </div>
      <button type="submit" class="btn-verify">🩸 Confirm Verification</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
