{% extends 'mainLayout.html' %}
{% block content %}

    
    {% with message = get_flashed_messages() %}
    {% if message %}
    {% for msg in message %}
    <p class="alert alert-danger" style="font-family: sans-serif; font-size:small; margin-top: 20%; margin-bottom: 0%;">
        {{msg}}
    </p>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <body style="
	display: grid;
	justify-content: center;
	align-items: center;
	
	font-family: 'Jost', sans-serif; background: #000000;">

  
	<div class="main" style="border: 1px solid darkred; margin-top: 30%;">  	
		<input type="checkbox" id="chk" aria-hidden="true">
            <label for="chk" aria-hidden="true" style="color: #fff;  font-size: 40px;">Admin Login</label>
			<div class="login" style="font-size: larger; ">

    <form action="/adminLogin" method="post">
        		
					<input type="text" name="user" placeholder="Enter your user name" required="">
					<input type="password" name="password" placeholder="Password" required="">
					<button type="submit" style="color: white; width: 100px; height: 30px; font-size: medium;width: 60%;
            height: 30px;
            margin: 10px auto;
            justify-content: center;
            display:block;
            color: #fff;
            background: rgb(115, 6, 6);
            font-size: 1em;
            font-weight: bold;
            margin-top: 30px;
            outline: none;
            border: none;
            border-radius: 5px;
            transition: .2s ease-in;
            cursor: pointer;">Login</button>
        <div class="form-row">
          
            </div>
        </div>
    </form>
    
    
    <!-- back to home -->
    <div class="back" style="text-align:center; margin-top:20px;font-size: 18px;">
        <a href="{{ url_for('index') }}">← Back to Home</a>
    </div>
</div>
{% endblock %}
