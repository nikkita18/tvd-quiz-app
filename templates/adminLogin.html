{% extends 'mainLayout.html' %}
{% block content %}
<div style="min-height: calc(100vh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px;">
    {% with message = get_flashed_messages() %}
    {% if message %}
    <div style="width: 100%; max-width: 400px; margin-bottom: 20px;">
        {% for msg in message %}
        <div class="alert alert-danger" style="background: rgba(142, 9, 35, 0.4); border: 1px solid #e63946; color: #fff; border-radius: 12px; font-size: 0.9rem;">
            {{msg}}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="main" style="margin: 0 auto; min-height: auto; padding-bottom: 25px;">  	
        <input type="checkbox" id="chk" aria-hidden="true">
        <div class="login" style="padding: 20px 15px;">
            <form action="/adminLogin" method="post">
                <label for="chk" aria-hidden="true" style="color: #fff; font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 24px; display: block; text-shadow: 0 0 15px rgba(230, 57, 70, 0.6); text-align: center;">Council Access</label>
                <input type="text" name="user" placeholder="Overseer Username" required="" style="width: 85%; margin: 12px auto; display: block; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                <input type="password" name="password" placeholder="Council Key / Password" required="" style="width: 85%; margin: 12px auto; display: block; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.6); color: #fff;">
                <button type="submit" style="width: 85%; height: 46px; margin: 24px auto 16px; display: block; color: #fff; background: linear-gradient(135deg, #c8102e, #8e0923); font-size: 1rem; font-weight: bold; outline: none; border: none; border-radius: 10px; box-shadow: 0 6px 20px rgba(200, 16, 46, 0.5); cursor: pointer; transition: all 0.25s ease;">Unlock Vault</button>
            </form>
            <div style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                <a href="{{ url_for('index') }}" style="color: #aaa; text-decoration: none;">← Return to Mystic Falls</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
